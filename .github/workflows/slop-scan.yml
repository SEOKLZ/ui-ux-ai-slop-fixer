# Example: gate PRs on AI-slop tells. Copy into your own project.
name: slop-scan
on: [pull_request]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Scan UI for AI-slop tells
        run: |
          curl -sSLO https://raw.githubusercontent.com/lilbalto/ui-ux-ai-slop-fixer/main/skills/ui-ux-ai-slop-fixer/scripts/slop_scan.py
          python3 slop_scan.py src --min-severity high
